name: Publicar SGA no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: Compilar Angular com caminho correto
        env:
          SGA_FIREBASE_API_KEY: ${{ secrets.SGA_FIREBASE_API_KEY }}
          SGA_FIREBASE_AUTH_DOMAIN: ${{ secrets.SGA_FIREBASE_AUTH_DOMAIN }}
          SGA_FIREBASE_PROJECT_ID: ${{ secrets.SGA_FIREBASE_PROJECT_ID }}
          SGA_FIREBASE_APP_ID: ${{ secrets.SGA_FIREBASE_APP_ID }}
        run: |
          test -n "$SGA_FIREBASE_API_KEY" || (echo 'Configure os secrets do Firebase no repositório.' && exit 1)
          node scripts/generate-firebase-config.mjs
          npx ng build --base-href "/${{ github.event.repository.name }}/"
          cp dist/sga/browser/index.html dist/sga/browser/404.html
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sga/browser
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
